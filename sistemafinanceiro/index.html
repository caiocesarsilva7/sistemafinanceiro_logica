<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Fluxo de Caixa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Fluxo de Caixa</h1>
    <form id="transaction-form">
      <input type="text" id="description" placeholder="Descrição" required />
      <input type="number" id="amount" placeholder="Valor" required />
      <select id="type" required>
        <option value="receita">Receita</option>
        <option value="despesa">Despesa</option>
      </select>
      <button type="submit">Adicionar</button>
    </form>

    <table id="transactions-table">
      <thead>
        <tr>
          <th>Descrição</th>
          <th>Valor</th>
          <th>Tipo</th>
          <th>Data</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="summary">
      <div>
        <h3>Receitas</h3>
        <p id="total-receitas">R$ 0,00</p>
      </div>
      <div>
        <h3>Despesas</h3>
        <p id="total-despesas">R$ 0,00</p>
      </div>
      <div>
        <h3>Saldo</h3>
        <p id="saldo">R$ 0,00</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
